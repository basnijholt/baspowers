<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-labelledby="title">
  <title id="title">Baspowers</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="10" y="10" width="120" height="120" rx="30"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    .sheen { animation: sweep 6s ease-in-out infinite; }
    .halo { animation: breathe 4s ease-in-out infinite; transform-origin: 70px 70px; }
    @keyframes sweep {
      0%, 55% { transform: translateX(0) skewX(-20deg); }
      85%, 100% { transform: translateX(300px) skewX(-20deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sheen, .halo { animation: none; }
      .sheen { opacity: 0; }
    }
  </style>

  <rect x="10" y="10" width="120" height="120" rx="30" fill="url(#tile)"/>
  <g clip-path="url(#tile-clip)">
    <rect class="sheen" x="-90" y="-20" width="60" height="180" fill="url(#sheen)"/>
  </g>
  <path class="halo" d="M82 20 L36 80 H63 L53 120 L104 57 H76 Z" fill="#fff" filter="url(#glow)"/>
  <path d="M82 20 L36 80 H63 L53 120 L104 57 H76 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>

  <text x="158" y="90" fill="url(#word)" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">baspowers</text>
</svg>
